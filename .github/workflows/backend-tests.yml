# Runs the backend Maven suite, including Testcontainers integration tests.
# Uses the Docker engine already installed on the GitHub-hosted runner.
# Does not start a PostgreSQL service, deploy the application, or read secrets.

name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker
        run: |
          set -eu
          docker version
          docker info

      - name: Refuse live database configuration
        run: |
          set -eu
          found=0

          for name in \
            SPRING_DATASOURCE_URL \
            SPRING_DATASOURCE_USERNAME \
            SPRING_DATASOURCE_PASSWORD \
            SUPABASE_JWT_ISSUER \
            SUPABASE_JWKS_URI \
            SUPABASE_JWT_AUDIENCE \
            SUPABASE_URL \
            SUPABASE_DB_PASSWORD \
            SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_ANON_KEY \
            DATABASE_URL \
            PORTICO_DATASOURCE_ALLOW_LOCAL
          do
            if printenv "$name" >/dev/null; then
              echo "::error title=Live database guard::$name is set. This job must not receive production database or Supabase configuration."
              found=1
            fi
          done

          test "$found" -eq 0

      - name: Run backend tests
        run: |
          set -eu
          chmod +x mvnw
          ./mvnw -B -ntp test

      - name: Verify integration tests actually ran
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          classes = [
              "za.ac.mycput.interfaces.rest.PortfolioPersistenceTest",
              "za.ac.mycput.interfaces.rest.PropertyApiTest",
              "za.ac.mycput.interfaces.rest.AuthorisationApiTest",
          ]

          for class_name in classes:
              report = (
                  Path("target/surefire-reports")
                  / f"TEST-{class_name}.xml"
              )

              if not report.is_file():
                  raise SystemExit(
                      f"Missing integration test report: {report}"
                  )

              root = ET.parse(report).getroot()

              tests = int(root.attrib.get("tests", "0"))
              skipped = int(root.attrib.get("skipped", "0"))
              failures = int(root.attrib.get("failures", "0"))
              errors = int(root.attrib.get("errors", "0"))

              print(
                  f"{class_name}: "
                  f"tests={tests}, "
                  f"skipped={skipped}, "
                  f"failures={failures}, "
                  f"errors={errors}"
              )

              if tests == 0 or skipped != 0:
                  raise SystemExit(
                      f"{class_name} did not execute all expected tests."
                  )

              if failures != 0 or errors != 0:
                  raise SystemExit(
                      f"{class_name} contains failures or errors."
                  )
          PY

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14